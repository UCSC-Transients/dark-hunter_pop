# Pytest defaults for local and CI (ARCHITECTURE.md §10).
#
# Required (merge gate):  pytest -m "unit or physics or api"
# Optional gaiamock:      pytest -m gaiamock   # after scripts/install_gaiamock_mod.sh
# Optional network/slow:  pytest -m network / pytest -m slow

[pytest]
testpaths = tests
pythonpath = src
addopts = -ra
markers =
    unit: fast unit tests (required CI)
    physics: analytic physics tests (required CI)
    api: cross-module I/O contract tests (required CI)
    gaiamock: requires vendored gaiamock_mod overlay + compiled .so
    network: requires external network services
    slow: long-running / performance tests
