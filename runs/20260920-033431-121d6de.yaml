synthetic_stand_ins:
- name: offline_gaia_snapshot_replay
  stage: data_acquisition
  kind: offline_replay
  replaces: a live gaiadr3.nss_two_body_orbit archive query
  description: "data_acquisition is replayed from a Gaia snapshot already on this\
    \ laptop instead of re-querying the archive. The rows are real DR3 NSS rows, not\
    \ synthetic \u2014 but they are frozen at the snapshot's query date, so this run\
    \ says nothing about the current archive contents, and the funnel counts it reports\
    \ are the snapshot's. Replay also makes the run reproducible, which a live query\
    \ is not."
  config_keys:
  - dr3.nss_table
  - paths.data_root
  values:
    snapshot_meta: data/dr3/gaia_snapshots/20260826T234425Z_3d3f740b080c/meta.yaml
- name: analytic_companion_nature_evidence
  stage: companion_nature_likelihood
  kind: analytic_surrogate
  replaces: per-star SED / XP model comparison evidence (dark vs WD vs other)
  description: 'The WD/other/dark decision is driven by closed-form magnitude-mass
    relations, not by a real model comparison. The phot_sed adapter that would supply
    genuine dynesty BIC and lnZ is wired (#197), but nothing reaches it yet: the upstream
    wd model emits no readable BIC at the pop-facing path (#206) and the channel needs
    all three hypotheses, so every candidate falls back to the analytic relations
    and is labelled analytic_fallback. Consequences: the five-class responsibilities
    are a smooth function of absolute magnitude rather than a fit, they carry no covariance
    of any kind because the surrogate has no uncertainty model at all, and WD contamination
    is entirely unconstrained by this run.'
  config_keys:
  - companion_nature.wd_mg_zero_point
  - companion_nature.wd_mg_mass_slope
  - companion_nature.other_mg_zero_point
  - companion_nature.other_mg_mass_slope
  - companion_nature.primary_mg_zero_point
  - companion_nature.primary_mg_mass_slope
  - companion_nature.dark_to_bh_fraction
  - companion_nature.delta_bic_threshold
  values:
    wd_mg_zero_point: 12.0
    wd_mg_mass_slope: -2.5
    other_mg_zero_point: 5.0
    other_mg_mass_slope: -5.0
    dark_to_bh_fraction: 0.5
    delta_bic_threshold: 10.0
- name: unrefined_primary_masses
  stage: mass_derivation_refined
  kind: disabled_path
  replaces: uberMS-refined primary masses M1
  description: 'dark-hunter_sed is not importable in this environment, and mass_derivation.require_sed_package
    is false, so the stage runs in its documented degraded mode (issue #181): the
    bulk TAG10 M1 estimate passes through unrefined for every candidate and no refinement
    happens at all. M1 feeds the companion mass, so every M2 downstream carries the
    bulk estimate''s error budget rather than a refined one.'
  config_keys:
  - mass_derivation.require_sed_package
  - mass_derivation.sed_summary_root
  values:
    require_sed_package: false
    plan_note: 'SED UNAVAILABLE (darkhunter_sed.batch cannot import darkhunter_rv.summary_paths
      (darkhunter_rv not installed)); require_sed_package=false so this stage will
      RUN in DEGRADED mode: bulk M1 estimates pass through unrefined for every candidate,
      refinement is skipped'
- name: per_sample_selection_weights
  stage: inference
  kind: config_placeholder
  replaces: forward-modeled per-sample selection functions SF_sample_s(theta)
  description: 'Each published sample''s own cut chain is itself a selection function
    and must be forward-modeled (CLAUDE.md, Phase 8). None of them reproduces its
    published N yet, so none may be forward-modeled here. The multi-sample inclusion
    operator instead runs on flat catalog weights and one flat spurious rate shared
    by every sample. Flat is the crudest available stand-in and that is the point:
    a weight chosen to make the output look plausible would be worse than an obviously
    crude one. No inference conclusion survives this.'
  config_keys:
  - inference.multi_sample.default_catalog_sf
  - inference.multi_sample.default_p_spurious
  - inference.default_astrometric_sf
  - inference.default_followup_sf
  values:
    default_catalog_sf:
      andrews2022_modified: 1.0
      elbadry2024: 1.0
      elbadry2026: 1.0
    default_p_spurious: 0.25
    default_astrometric_sf: 1.0
    default_followup_sf: 1.0
- name: no_reproducing_literature_sample
  stage: sample_selection
  kind: disabled_path
  replaces: a reproducing literature sample feeding inference
  description: "No literature sample reproduces its published N yet (CLAUDE.md Status;\
    \ that is Wave A's work), so the sample-selection layer contributes nothing trustworthy\
    \ to this run either way. Samples in reproduction mode are regression tests against\
    \ a published number and are never inference inputs by construction. This run's\
    \ config additionally leaves andrews2022_modified enabled in forward_model mode,\
    \ inherited from config.yaml as authored \u2014 this harness neither enabled it\
    \ nor changed it. Its contribution is still meaningless here, because the per-sample\
    \ weight it would carry is the flat placeholder described under per_sample_selection_weights,\
    \ not a forward-modeled selection function."
  config_keys:
  - sample_selection.samples
  values:
    modes:
      andrews2022: reproduction
      andrews2022_modified: forward_model
      elbadry2024: reproduction
      elbadry2026: reproduction
    forward_model_mode_samples:
    - andrews2022_modified
- name: ci_scale_dynesty
  stage: inference
  kind: ci_scale_sampler
  replaces: a production nested-sampling run
  description: "dynesty stays at the CI smoke settings. The posterior is not converged,\
    \ the evidence is not usable, and the multi-run robustness protocol that validates\
    \ a real dynesty result (ARCHITECTURE.md \xA74 inference) has not been satisfied.\
    \ The cluster recipe lives in config/fragments/inference.yaml and is deliberately\
    \ not used: raising these numbers here would buy a slower run with no more meaning,\
    \ since the likelihood it samples is built on the placeholders above."
  config_keys:
  - inference.nlive
  - inference.dlogz
  - inference.maxcall
  - inference.n_robustness_runs
  values:
    nlive: 20
    dlogz: 0.5
    maxcall: 400
    n_robustness_runs: 1
- name: fiducial_mass_function_heights
  stage: population_model
  kind: config_placeholder
  replaces: mass-function bin heights informed by anything
  description: 'The non-parametric mass function starts from fiducial bin heights
    on bin edges fixed in config before any real count was looked at (which is the
    correct guardrail, not a stand-in). What makes it a stand-in is that the heights
    themselves are a configured fiducial: the shape of the product figure is set by
    that fiducial and by the class truncations, not by the data. Read the figure as
    a check that a shape propagates, and read nothing else from it.'
  config_keys:
  - population_model.mass_function_model
  - population_model.mass_bin_edges_msun
  - population_model.default_bin_height
  values:
    mass_function_model: free_height_bins
    n_bins: 8
