# Known-truth benchmark table for Gaia BH systems (ARCHITECTURE.md §4 diagnostics).
# Science expectations live here with provenance — not hardcoded in Python.
schema_version: 1
table_id: known_truth_gaia_bh
active_dr_mode: dr3
provenance:
  project_authority: "docs/ARCHITECTURE.md §4 diagnostics (known-truth benchmarks)"
  notes: >
    Gaia-BH1/BH2 are clean DR3 NSS detections. Gaia-BH3 is a DR3 marginal/non-detection
    with RUWE≈3.4 and would have appeared in the acceleration catalog for parts of its orbit.
    Numerical thresholds used by expectation checks are config-owned (benchmarks.ruwe_match_tolerance).
systems:
