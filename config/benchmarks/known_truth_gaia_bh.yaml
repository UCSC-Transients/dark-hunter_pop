    source_id: 4373465352415301632
    dr3_expectation: clean_detection
    nss_orbital_expected: true
    ruwe_approx: null
    acceleration_catalog_parts_of_orbit: false
    literature:
      citation: "El-Badry et al. 2023a, MNRAS (Gaia BH1)"
      designation: "Gaia DR3 4373465352415301632"
      notes: "Sun-like star + ~10 Msun dark companion; clean DR3 astrometric orbit."
  - name: Gaia-BH2
    source_id: 5870569352746779008
    dr3_expectation: clean_detection
    nss_orbital_expected: true
    ruwe_approx: null
    acceleration_catalog_parts_of_orbit: false
    literature:
      citation: "El-Badry et al. 2023b, MNRAS (Gaia BH2)"
      designation: "Gaia DR3 5870569352746779008"
      notes: "Red giant + ~9 Msun dark companion; clean DR3 astrometric orbit + RV confirmation."
  - name: Gaia-BH3
    source_id: 4318465066420528000
    dr3_expectation: marginal_or_non_detection
    nss_orbital_expected: false
    ruwe_approx: 3.4
