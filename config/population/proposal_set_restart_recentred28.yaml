# RE-CENTRED TUNING generation 28 (#391 rung 3, Ryan 2026-10-09: "re-centred proposal tuning generation, ~1 h").
# Same models and generation-time settings as generations 23-27 (the target is unchanged; sampling
# efficiency only). The proposal is moved toward the rung-3 first-fit best fit (PR #459,
# docs/gate391/rung3_first_fit/, noW):
#   * (log q, log P) shape component: x q^2.40, twins (q >= 0.95) x e^-1.53, x exp(-0.23 (log P - 2.7)),
#     long-P weight x e^0.58 above log P 3 (logistic, width 0.1); the 30% defensive m2 x period part
#     is unchanged, so coverage stays complete and weights stay bounded;
#   * eccentricity: d_eta = -0.45 moves mass to low e -> floor (e^-0.9) component 0.30 -> 0.45,
#     support U(0, e_max) 0.50 -> 0.40, defensive U(0, 0.999) 0.20 -> 0.15 (bounded: floor_eta
#     -0.9 <= the target eta floor);
#   * parent / M1 frequency: unchanged. The best-fit M1 modifier relative to the MdS17 + MP-Q7 target
#     is ~0.73-0.80 for 0.15 < M1 < 0.8 Msun and (M1/0.8)^0.06 above: within 25% everywhere, too small
#     to be worth a new parent component (and alpha_lo/alpha_hi are MC-indicative only).
# 30,000 draws (~0.8 CPU-s/draw -> ~6-7 CPU-h, ~1 h at 8 workers). draw_index from 837,000
# (after gen 27: 817,000-836,999). Combined with gens 23-27 by deterministic-mixture weights.
# Not under config/fragments/.

proposal:
  generation: 28
  n_draws: 30000
  base_seed: 391
  data_release: dr3
  ruwe_min: 1.4                      # gaiamock cascade (Halbwachs et al. 2023 §1.2 input RUWE)
  skip_acceleration: false
  parent:                            # q(s) = u uniform + (1-u) ∝ min(plx, cap)^beta
    uniform_fraction: 0.3
    parallax_power: 0.75
    parallax_cap_mas: 10.0
    evolved_weight: 0.1
  m2:                                # log M2 mixture: log q ~ U (tied to M1) + log-uniform M2
    q_tied_weight: 0.9
    q_min: 0.08
    q_max: 1.0
    m2_min_msun: 0.05
    m2_max_msun: 50.0
  flux:                              # P(f = 0) = dark_fraction; luminous part in log10 f
    dark_fraction: 0.1
    relation: mist_coeval_row
    relation_weight: 0.9
    relation_sigma_dex: 0.20
    log_f_min: -7.0                  # MP-Q28d: evolved-row targets reach ~1e-6 (spec §10.4, §11.9)
    log_f_max: 0.5
    evolved_rows_centre: evolved_relation   # MP-Q28d (decided 2026-10-04)
  period:                            # log P mixture: core + MdS17-wide defensive component
    core_weight: 0.8
    core_log_p_min: 1.0
    core_log_p_max: 4.0
    log_p_min: 0.2
    log_p_max: 8.0
  eccentricity:                      # #409/#410: covers MdS17 e < e_max(P); bounded weights
    shape: mds17_bounded
    circular_period_days: 2.0        # MdS17 §2: P <= 2 d circular (matches the target)
    floor_eta: -0.9                  # must be <= target provisional_eta_floor (checked)
    floor_weight: 0.45
    support_weight: 0.40
    defensive_e_max: 0.999           # covers e > e_max for alternative models (MP-Q12)
    e_max_period_scale_days: 2.0     # MdS17 Eq. 3
    e_max_exponent: -0.6666666666666666
  m2_p_shape:                        # MdS17-shaped joint (log q, log P) component
    weight: 0.7
    table_path: config/population/moe_distefano2017.yaml
    m1_interpolation: linear_m1
    q_min: 0.1
    q_max: 1.0
    log_p_min: 1.0
    log_p_max: 4.0
    n_log_q: 40
    n_log_p: 45
    log_m1_step: 0.05
    dgamma_q: 2.40                   # rung-3 first fit (PR #459), noW best fit
    ln_f_twin: -1.53
    twin_q_min: 0.95
    gamma_p: -0.23
    log_p_pivot: 2.7
    ln_long_p: 0.58
    long_p_centre: 3.0
    long_p_width: 0.1
  acceleration_publication:          # El-Badry et al. (2024) §5.2.1
    significance_min: 20.0
    f2_max_seven_parameter: 22.0
  # Generation-time decisions (spec §0.1).
  decision_ref: "Ryan 2026-10-02, #391 issuecomment-5963152741 (spec §0.1)"
  parallax_floor_mas: 0.2                           # MP-Q1
  halbwachs_ipd_cstar_cuts: applied_star_values     # MP-Q3 (Halbwachs et al. 2023 §1.2)
  halbwachs_cuts:
    ipd_frac_multi_peak_max: 2.0                    # step (b), <=
    ipd_gof_harmonic_amplitude_max: 0.1
    cstar_nsigma: 1.645
  truth_distance: bailer_jones2021_geometric        # MP-Q4
  m1: isochrone_posterior_draw_deblended            # MP-Q5/Q28c/Q35/Q36 (#418, spec §0.4, §11.9)
  giant_flag_logg_max: 3.6                          # TAG10 mode only (isochrone mode uses the §10.2 CMD flag)
  light_split: observed_g_is_system_total           # MP-Q6
  epoch_model: dr3_config                           # #400 E1 decided: on (dr3.epoch_model)

target_mds17:                        # rung 2: MdS17 at published parameters, luminous only
  table_path: config/population/moe_distefano2017.yaml
  provisional_m1_interpolation: linear_m1           # MP-Q10
  provisional_eta_floor: -0.9                       # MP-Q11
  provisional_low_mass_policy: log_linear_to_zero   # MP-Q7 (El-Badry et al. 2024 §3)
  provisional_low_mass_anchor_msun: 0.8
  provisional_low_mass_zero_msun: 0.08
  provisional_multiplicity: poisson_intensity       # MP-Q9
  mass_luminosity: mist_coeval                      # MP-Q40 decided 2026-10-04 (replaces MP-Q13 Janssens for MS companions)
  flux_sigma_dex: 0.1                               # MP-Q13, decided
  provisional_compact_mixture: none                 # MP-Q17
