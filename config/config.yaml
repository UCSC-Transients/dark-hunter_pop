# Canonical merged configuration for dark-hunter_pop.
#
# Populated by the Foundation subagent (config schema) and then extended one domain section per
# stage. During development each subagent drafts a fragment under config/fragments/ (tracked);
# the review/integration subagent merges fragments here at each checkpoint
# (ARCHITECTURE.md §7, dark-hunter-pop-workflow §5).
#
# Hard rule: true physical constants live in src/darkhunter_pop/constants.py; choosable numbers,
# thresholds, method switches, and paths live here. No secrets in git.
#
# DR3- and DR4-specific keys are configured independently even where the values coincide;
# genuine physics/population parameters are shared (ARCHITECTURE.md §6). Default active mode: dr3.
#
# Reserved keys (filled by Foundation): paths.artifact_root, active_dr_mode,
# mass_calibration.method, mass_calibration.sigma_logM, mass_calibration.santos_correction, etc.

paths:
  artifact_root: output

active_dr_mode: dr3

gaiamock:
  mod_release: gaiamock-mod-v1
