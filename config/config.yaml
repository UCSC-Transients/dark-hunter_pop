  tick_minor_length: 4.0
  tick_direction: in
  spines_width: 2.0
  line_width: 2.0
  marker_size: 6.0
  figsize_landscape: [7.0, 5.0]
  figsize_portrait: [5.0, 7.0]
  figsize_wide: [8.0, 4.0]
  # Okabe–Ito (https://jfly.uni-koeln.de/color/) — pair with linestyle/marker cycles.
  color_cycle:
    - "#000000"
    - "#E69F00"
    - "#56B4E9"
    - "#009E73"
    - "#F0E442"
    - "#0072B2"
    - "#D55E00"
    - "#CC79A7"
  linestyle_cycle: ["-", "--", "-.", ":"]
  marker_cycle: ["o", "s", "^", "D", "v", "P", "X", "*"]
  hist_face_color: "#0072B2"
  hist_edge_color: "#000000"
  threshold_color: "#D55E00"
  threshold_linestyle: "--"
  # Product-figure layout knobs (display-only; `plotting` is not a checksum input).
  # Decades of log dN/dM range kept below the maximum: a soft M_TOV truncation
  # decays smoothly toward zero, so an unclipped axis spans >100 decades.
  dndm_y_decades: 12.0
  # Line spacing used when a product figure reserves a caption band.
  caption_line_spacing: 1.45
  # Heavy-tail auto log/symlog threshold (decades), horizontal-bar switch and
  # reference-line styles (#333). Display-only.
  auto_log_min_decades: 2.0
  categorical_max_vertical_labels: 8
  categorical_row_height_inches: 0.32
  reference_line_colors: ["#D55E00", "#CC79A7", "#000000"]
  reference_linestyle_cycle: ["--", ":", "-."]
  bar_hatch_cycle: ["", "//", "..", "xx"]
