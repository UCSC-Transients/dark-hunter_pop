  # with the conflicting bands masked (ARCHITECTURE.md §4 "Multi-solution sources").
  crossmatch_fanout_maskable_bands:
  - J
  - H
  - Ks
  nss_table: gaiadr3.nss_two_body_orbit
  # #308: frozen NSS enrichment (corr_vec / bit_index / NSS errors / K1) merged into
  # data_acquisition rows per (source_id, nss_solution_type). Never re-run the job.
  nss_enrichment_snapshot: nss_enrichment
  # Shahaf et al. (2023b) Table 2 snapshot (#315; scripts/fetch_shahaf2023b_class3.py).
  shahaf2023b_class3_snapshot: shahaf2023b_class3_20260929T195047Z_7b6d287e
  gaia_source_table: gaiadr3.gaia_source
  allow_astrometric_epoch_outliers: false
  selection_function_astrometric:
    d_min_pc: 50.0
    d_max_pc: 1200.0
    # Gaia DR3 orbital-solution cuts applied to mock cascade outputs: Halbwachs et al.
    # (2023) as restated in El-Badry et al. (2024, arXiv:2411.00088) Eq. 18
    # (a0/sigma_a0 > 5, F2 < 25) and Eqs. 20-22 (#339). Paper values; never retune.
    orbital_solution_cuts:
      a0_over_err_min: 5.0
      goodness_of_fit_f2_max: 25.0
      parallax_over_error_times_period_min_days: 20000.0
      a0_over_err_times_sqrt_period_min: 158.0
      sigma_e_ln_period_slope: 0.079
      sigma_e_intercept: -0.244
    # Real side of the El-Badry et al. (2024) Fig. 5 comparison: §4 "nss_solution_type
    # = Orbital or AstroSpectroSB1" (168,065 published rows, uncut snapshot; #339).
    elbadry2024_comparison_nss_solution_types:
    - Orbital
    - AstroSpectroSB1
  selection_function_followup:
    accel_jerk_catalog_id: dr3_accel_jerk_pinned
