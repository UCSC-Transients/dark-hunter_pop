# Andrews et al. (2022) modified variant (CONTINUATION_PLAN §6.6).
# Independent named sample. Does not edit the frozen andrews2022 file.
# Drops harmonic_exclusion (empty exclusions) and restores Gaia BH1.
# Target N = 25. This variant feeds forward-modeling and inference.
#
# Do NOT generalize Andrews' one-source exclusion into a period-near-harmonic
# cut: (1) it would discard genuine systems — Gaia BH1 is the proof; (2) whether
# proximity to a scanning-law harmonic predicts spuriousness belongs to the
# shared spuriousness model, not a selection-file threshold.

