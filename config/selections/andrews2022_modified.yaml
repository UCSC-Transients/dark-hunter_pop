  identification: "Gaia BH1 (El-Badry et al. 2023a)"
  rationale: >-
    Andrews et al. (2022) removed this source as a probable Gaia scanning-law
    harmonic contaminant (P = 185.8 d, ~3x the scanning period, m_f ~ 11.6
