  # report the more specific astrophysical finding wherever one exists (solution_error rows
  # here are only 29/151 = 19.2%).
  #
  # Under the Q15 ruling the comparable quantity is the paper's own partition:
  # ~50% spurious solutions PLUS "a majority of the rest" being post-mass-transfer binaries or
  # hierarchical triples, i.e. a non-candidate fraction above 75.0% and purity below 25.0%.
  spurious_fraction: 0.821
