  state: "good | spurious | unknown_insufficient_data | unknown_unobservable | unknown_unspecified"
  reason: "spurious rows only: solution_error | luminous_companion | hierarchical_triple"
  nature: "companion-nature axis; null where not stated"
  censor_reason: "why no verdict; null unless state starts with unknown"
  censor_exogenous: "true if the censoring mechanism is argued independent of spuriousness"

