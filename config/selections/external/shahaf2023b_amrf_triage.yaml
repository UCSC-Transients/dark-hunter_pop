# Shahaf et al. (2023b), MNRAS 518, 2991 (arXiv:2209.00828v2): AMRF class-III triage of the Gaia DR3
# astrometric orbits — the method definition reimplemented by darkhunter_pop.shahaf2023b_triage (#682).
#
# Frozen external definition. Every number is the paper's (section and equation cited per key) or the
# authors' published supplementary table; nothing here was tuned to land on the 177-row Table 2.
# Where the paper does not state a step, the value used is the reading that reproduces the authors'
# own per-source Table 1 quantities (AMRF, AMRF_error, classII_prob, classIII_prob for all 101,380
# clean-sample rows), and the alternatives are recorded under `readings:` with their measured effect
# (docs/RUNG5_SPEC.md §2.7.4, "Shahaf 2023b AMRF class III").
#
# Real DR3 vs mock: the parent cuts (iii)/(iv) read gaiadr3.binary_masses (IsocLum M1 for a
# main-sequence primary); a mock row has no binary_masses analogue and is handled by the caller
# (darkhunter_pop.shahaf2023b_triage.mock_class3_columns), never silently.

schema_version: 1
name: shahaf2023b_amrf_triage

provenance:
  reference: "Shahaf, Bashi, Mazeh, Faigler, Arenou, El-Badry & Rix (2023), MNRAS 518, 2991"
  arxiv: "2209.00828v2"
  sections: "2.3 (limiting curves), 3.1 (sample selection), 3.3 (classification probability), 4 (FDR)"
  limiting_curves_source: "MNRAS supplementary stac3290_supplemental_file.zip :: AMRF_limiting_curves.fits"
  limiting_curves_fits_sha256: 8c9cc0080cff079396f0b12bf36ff4e084d5dcba551085c7406e46960130598b
  supplementary_zip_sha256: b2afc8d28692dd682179c51af22ee0a781c1e1dbd767f1ddfc598ad3d6e64ed6
  validation_tables: "VizieR J/MNRAS/518/2991/table1 (101,380 rows), table2 (177 rows)"
  frozen_on: "2026-11-14"
  issue: 682

# §3.1 conditions (i)-(iv), then the Halbwachs et al. (2022) cuts, Eq. (4), and the period cut.
# Published counts after each step: 127,026 / 126,624 / 110,401 / 101,380.
parent:
  solution_types: [Orbital, AstroSpectroSB1]          # (i)
  bit_index: [8191, 65535]                             # (ii) all orbital parameters fitted
  binary_masses_m1_ref: IsocLum                        # (iii)
  binary_masses_combination_methods: [Orbital+M1, AstroSpectroSB1+M1]   # (iv) not tied to (i) per source
  # Halbwachs et al. (2022) criteria as stated in §3.1, P in days:
  eccentricity_error_ln_period_slope: 0.079            # Δe < 0.079 ln P − 0.244
  eccentricity_error_offset: -0.244
  parallax_snr_period_coeff: 20000.0                   # ϖ/σϖ > 20000 / P
  significance_period_coeff: 158.0                     # a0/σa0 > 158 / √P
  ti_relative_error_sq_sum_max: 36.0                   # Eq. (4): Σ (σ_X/X)², X ∈ {A,B,F,G} ≤ 36
  period_max_day: 1000.0                               # P < 1000 d (strict)
  expected_counts: {after_binary_masses: 127026, after_halbwachs: 126624, after_ti: 110401, clean: 101380}

amrf:
  # Eq. (1): A = (a0/ϖ) (M1/M☉)^(-1/3) (P/yr)^(-2/3), a0 from the Thiele–Innes constants.
  year_day: 365.25

monte_carlo:
  # §3.3: N = 1e5 draws of the Thiele–Innes constants, parallax, period, eccentricity and M1, "considering
  # the uncertainties and covariance between the parameters as reported in the Gaia catalogue".
  n_draws: 100000
  # Draws are taken in chunks from one per-source stream; a chunk count never changes a completed result.
  chunk_draws: 25000
  seed: 682
  # Eccentricity draws outside the physical domain are rejected and redrawn (keeps N valid draws).
  eccentricity_domain: [0.0, 1.0]                      # 0 ≤ e < 1
  # M1 ~ two half-normals of equal weight: m1 − (m1 − m1_lower)|z| or m1 + (m1_upper − m1)|z|.
  m1_draw: two_half_normals
  # §2.3 lookup table, linear interpolation in M1.
  limiting_curve_interpolation: linear
  # M1 draws outside the tabulated range 0.2–2.0 M☉ are clipped to it (AMRF and curve lookup alike);
  # see readings.off_grid.
  off_grid: clip_m1
  # Eq. (6): Pr = (r + 1) / (N + 1).
  probability_estimator: plus_one

decision:
  # §4: Benjamini & Hochberg (1995) FDR at α = 10% over the clean sample, Eq. (7).
  method: fdr_bh
  alpha: 0.10
  # Monte-Carlo p-value of the class-III null: (n_below + 1) / (N + 1), n_below = draws with A ≤ A_TR.
  p_value: n_below_plus_one
  # The paper's stated equivalent cut (§4): "only 16 out of the 10^5 Monte-Carlo instances fell below
  # the A_TR limit" (minimal Pr III = 99.984%). Used where the BH step cannot be run over the real DR3
  # clean sample (a mock catalogue): class III ⇔ n_below ≤ fixed_n_below_max.
  fixed_n_below_max: 16

readings:
  p_value:
    adopted: "n_below_plus_one: p = 1 − Pr III + 1/(N+1); BH at α = 0.1 over 101,380 → 177, Table 2 exactly"
    alternative: "one_minus_pr_iii: p = 1 − Pr III → 179 (adds 4384513795007410048, 4690739122056717184)"
  m1_draw:
    adopted: "two_half_normals (equal weight) — Table 1 Pr III reproduced within MC noise (χ²/n ≈ 1.1)"
    alternatives: "symmetric Gaussian σ = max side (χ²/n ≈ 2.9), split normal with continuous density (≈ 23)"
  amrf_error:
    note: "Table 1 AMRF_error = first-order propagation with the full NSS covariance and σ_M1 = max(m1_upper − m1, m1 − m1_lower); reproduced to 7e-7 relative. It is a reported column, not an input to the MC."
  off_grid:
    note: "Filled in from the measured comparison (see RUNG5_SPEC §2.7.4)."

