# El-Badry et al. (2024), Table 3 --- "All the NS candidates from Andrews et al. (2022, A22)
# and Shahaf et al. (2023b, S23)."  arXiv:2405.00089v2, Appendix A.
#
# Frozen external fixture, machine-transcribed from the published PDF.
# LABELED SET for the shared spuriousness model (CONTINUATION_PLAN.md section 4.8).
#
# STATE is four-valued (CONTINUATION_PLAN.md section 4.8):
#   good                       genuine compact-object candidate, solution reliable
#   spurious                   not a compact-object candidate; see `reason`
#   unknown_insufficient_data  observable, validation incomplete; RESOLVES with more time
#   unknown_unobservable       could not be followed up at all; does NOT resolve with time
#   unknown_unspecified        the table does not say which of the two above applies
#
# `reason` is recorded for every spurious row so a future refinement is ADDITIVE. v1 collapses
# these to one spurious state; a later split needs no re-extraction (section 15 Q16):
#   solution_error       the solution itself is wrong
#   luminous_companion   solution may be fine, but >=2 luminous stars, so not a compact object
#   hierarchical_triple  outer solution may be fine; an inner luminous binary is present
#
# `censor_exogenous` marks whether the reason a row is unknown is argued to be independent of
# whether its solution is genuine. Observability limits (magnitude, declination, elapsed
# baseline, rotational broadening) are exogenous; deprioritization on a fit statistic is NOT.
#
# `nature` is a SEPARATE axis owned by companion_nature_likelihood. An ultramassive WD is a
# compact object and therefore `good`, not spurious.

