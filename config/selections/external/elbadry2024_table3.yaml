  rows_transcribed: 60
  scope: "All NS candidates from Andrews et al. (2022) and Shahaf et al. (2023b)."
  used_by:
    - config/spuriousness_model.yaml

roles: [spuriousness_labels]

state_counts:
  good: 24
  spurious: 12
  unknown_insufficient_data: 10
  unknown_unobservable: 14

# 12 spurious / 48 rows with G < 15 = 25.0%, matching the paper's "about a quarter of candidates
# with good astrometric quality flags turned out to be spurious". The denominator is
# selection-dependent --- exactly the point of section 4.8.
published_rate_check:
  spurious_fraction_g_lt_15: 0.250
  numerator: 12
  denominator: 48

# The only endogenous censoring channel in the entire 293-source label set: 2 rows were not
# followed up BECAUSE their goodness of fit was poor, which is a model covariate. Every other
# unknown row is censored on observability. See section 4.8.
endogenous_censoring_rows: 2

columns:
  source_id: "Gaia DR3 source ID"
  reference: "parent catalog: A22 = Andrews et al. (2022), S23 = Shahaf et al. (2023b)"
  period_days: "Gaia astrometric orbital period [d], with 1-sigma uncertainty"
  g_mag: "apparent G [mag]"
  gof: "astrometric goodness of fit (F2)"
  status: "published follow-up status string, verbatim"
  state: "good | spurious | unknown_insufficient_data | unknown_unobservable | unknown_unspecified"
  reason: "spurious rows only: solution_error | luminous_companion | hierarchical_triple"
  nature: "companion-nature axis; null where not stated"
  censor_reason: "why no verdict; null unless state starts with unknown"
  censor_exogenous: "true if the censoring mechanism is argued independent of spuriousness"

