  # the frozen Andrews file. See CONTINUATION_PLAN.md section 6.6 and section 15 Q14.
  - source_id: 4373465352415301632
    g_mag: 13.8
    m_tilde_msun: {value: 11.5, err: 2.5}
    period_days: {value: 185.8, err: 0.3}
    a0_times_d_au: {value: 1.44, err: 0.10}
    gof: 0.3
    rv_amplitude_robust_kms: null
    rv_amplitude_expected_kms: {value: 165.0, err: 20.0}
    state: good
