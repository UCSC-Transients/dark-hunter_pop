# El-Badry et al. (2023a), Table E1.
#
# Frozen external fixture. Supplied directly by the user; NOT fetched or re-derived.
#
# DUAL PURPOSE --- do not trim this file to a source-ID list:
#   1. Membership for El-Badry 2026 astrometric subsample 2 (CONTINUATION_PLAN.md section 8.3).
#   2. LABELED SET for the shared spuriousness model (section 4.8). The columns are candidate
#      covariates and `verdict` is the spuriousness label.
#
# COMPLETE at six rows: Table E1 covers only the BH candidates, which is why it is small
# (section 15 Q13 resolved). The NS candidates are in elbadry2024_table3.yaml, and the full
# El-Badry 2026 candidate lists are in elbadry2026_table7.yaml and elbadry2026_table8.yaml.
#
# Schema matches the other three label fixtures: three-valued `verdict`, a separate `nature`
# axis, and `censor_reason` non-null exactly when verdict == undetermined.

schema_version: 2
name: elbadry2023_table_e1

provenance:
  reference: "El-Badry et al. (2023a), Table E1"
  supplied_by: user
  frozen_on: "2026-09-02"
  completeness: complete
  rows_transcribed: 6
  scope: "BH candidates only."
  used_by:
    - config/selections/elbadry2026.yaml      # subsample 2 membership
    - config/spuriousness_model.yaml          # labeled set

roles: [subsample_membership, spuriousness_labels]

label_counts:
  genuine: 1
  spurious: 4
  undetermined: 1

# Every source here that also appears in El-Badry 2026 Table 7 carries the same verdict, and the
# one `undetermined` row resolved to Gaia BH2. Cross-table agreement is exact.
cross_table_agreement:
  overlapping_with_elbadry2026_table7: 5
  disagreements: 0

verdict_encoding:
  # Published glyphs, mapped onto the shared three-valued taxonomy.
  spurious: "X"
  genuine: "check"
  undetermined: "shrug"

columns:
  source_id: "Gaia DR3 source ID"
  g_mag: "G [mag]"
  m_tilde_msun: "M-tilde [Msun], with 1-sigma uncertainty"
  period_days: "P_orb [d], with 1-sigma uncertainty"
  a0_times_d_au: "a0 x d [au], with 1-sigma uncertainty"
  gof: "goodness of fit"
  rv_amplitude_robust_kms: "observed robust RV amplitude [km/s]; null where not measured"
  rv_amplitude_expected_kms: "expected RV amplitude [km/s], with 1-sigma uncertainty"
  verdict: "genuine | spurious | undetermined"
  nature: "companion-nature axis; null where not stated"
  censor_reason: "why no verdict was reached; null unless verdict == undetermined"

