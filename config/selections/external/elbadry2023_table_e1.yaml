# El-Badry et al. (2023a), Table E1.
#
# Frozen external fixture. Supplied directly by the user; NOT fetched or re-derived.
#
# DUAL PURPOSE --- do not trim this file to a source-ID list:
#   1. Membership for El-Badry 2026 astrometric subsample 2 (CONTINUATION_PLAN.md section 8.3).
#   2. LABELED SET for the shared spuriousness model (section 4.8). The columns are candidate
#      covariates and `state` is the spuriousness label.
#
# COMPLETE at six rows: Table E1 covers only the BH candidates, which is why it is small
# (section 15 Q13 resolved). The NS candidates are in elbadry2024_table3.yaml, and the full
# El-Badry 2026 candidate lists are in elbadry2026_table7.yaml and elbadry2026_table8.yaml.
#
# STATE is four-valued (CONTINUATION_PLAN.md section 4.8):
#   good                       genuine compact-object candidate, solution reliable
#   spurious                   not a compact-object candidate; see `reason`
#   unknown_insufficient_data  observable, validation incomplete; RESOLVES with more time
#   unknown_unobservable       could not be followed up at all; does NOT resolve with time
#   unknown_unspecified        the table does not say which of the two above applies
#
# `reason` is recorded for every spurious row so a future refinement is ADDITIVE. v1 collapses
# these to one spurious state; a later split needs no re-extraction (section 15 Q16):
#   solution_error       the solution itself is wrong
#   luminous_companion   solution may be fine, but >=2 luminous stars, so not a compact object
#   hierarchical_triple  outer solution may be fine; an inner luminous binary is present
#
# `censor_exogenous` marks whether the reason a row is unknown is argued to be independent of
# whether its solution is genuine. Observability limits (magnitude, declination, elapsed
# baseline, rotational broadening) are exogenous; deprioritization on a fit statistic is NOT.

schema_version: 3
name: elbadry2023_table_e1

provenance:
  reference: "El-Badry et al. (2023a), Table E1"
  supplied_by: user
  frozen_on: "2026-09-02"
  completeness: complete
  rows_transcribed: 6
  scope: "BH candidates only."
  used_by:
    - config/selections/elbadry2026.yaml      # subsample 2 membership
    - config/spuriousness_model.yaml          # labeled set

roles: [subsample_membership, spuriousness_labels]

state_counts:
  good: 1
  spurious: 4
  unknown_insufficient_data: 1

# Every source here that also appears in El-Badry 2026 Table 7 carries the same state, and the
# one unknown row resolved to Gaia BH2. Cross-table agreement is exact.
cross_table_agreement:
  overlapping_with_elbadry2026_table7: 5
  disagreements: 0

state_encoding:
  # Published glyphs, mapped onto the shared four-state taxonomy. The shrug glyph carries no
  # mechanism of its own; it is resolved per-row below rather than assumed.
  spurious: "X"
  good: "check"
  unknown: "shrug"

columns:
  source_id: "Gaia DR3 source ID"
  g_mag: "G [mag]"
  m_tilde_msun: "M-tilde [Msun], with 1-sigma uncertainty"
  period_days: "P_orb [d], with 1-sigma uncertainty"
  a0_times_d_au: "a0 x d [au], with 1-sigma uncertainty"
  gof: "goodness of fit"
  rv_amplitude_robust_kms: "observed robust RV amplitude [km/s]; null where not measured"
  rv_amplitude_expected_kms: "expected RV amplitude [km/s], with 1-sigma uncertainty"
  state: "good | spurious | unknown_insufficient_data | unknown_unobservable | unknown_unspecified"
  reason: "spurious rows only: solution_error | luminous_companion | hierarchical_triple"
  nature: "companion-nature axis; null where not stated"
  censor_reason: "why no verdict; null unless state starts with unknown"
  censor_exogenous: "true if the censoring mechanism is argued independent of spuriousness"

data:
  # Observed RV amplitude 12.9 km/s against an expected 674 +/- 154: the astrometric solution
  # cannot be right. Solution error, not a luminous companion.
  - source_id: 3640889032890567040
    g_mag: 9.2
    m_tilde_msun: {value: 122.0, err: 47.0}
    period_days: {value: 1076.0, err: 12.0}
    a0_times_d_au: {value: 10.2, err: 1.3}
    gof: 10.3
    rv_amplitude_robust_kms: 12.9
    rv_amplitude_expected_kms: {value: 674.0, err: 154.0}
    state: spurious
    reason: solution_error
    nature: null
    censor_reason: null
    censor_exogenous: null

  - source_id: 4467000291193143808
    g_mag: 15.5
    m_tilde_msun: {value: 119.0, err: 71.0}
    period_days: {value: 1647.0, err: 520.0}
    a0_times_d_au: {value: 13.4, err: 2.2}
    gof: 4.9
    rv_amplitude_robust_kms: null
    rv_amplitude_expected_kms: {value: 358.0, err: 182.0}
    state: spurious
    reason: solution_error
    nature: null
    censor_reason: null
    censor_exogenous: null

