# Frozen Andrews et al. (2022) reproduction sample (CONTINUATION_PLAN §6).
# Target N = 24. Do not edit numeric thresholds without a schema_version bump.
#
# The 1.4 Msun limiting mass is chosen specifically to avoid contamination by
# massive white dwarfs.
# Cuts giant_reject_logg and giant_reject_cmd remove giant donors. The paper
# acknowledges this as arguably over-restrictive (giants with NS/BH companions
# do exist), but large giant luminosities can hide even massive non-degenerate
# companions.
# The CMD cut uses absolute magnitudes derived from apparent magnitudes and
# parallax, with no extinction correction applied — reproduced as-published,
# including the omission.
# The excluded source has m_f ~ 11.6 Msun and P_orb = 186 d, roughly three
# times Gaia's scanning period; Halbwachs et al. (2022) identify large-m_f
# systems at harmonics of the scanning law as probable contaminants.
#
# Parent verification (solution-type set only; no quality cuts):
#   Working hypothesis (user-supplied, unverified at dispatch): all 12-parameter
#   orbital astrometric types that are not SB1/SB2, excluding AstroSpectroSB1
#   — Orbital + OrbitalAlternative + OrbitalAlternativeValidated +
#   OrbitalTargetedSearch + OrbitalTargetedSearchValidated.
#   ESA TAP 2026-09-03: that set returns 135760, not 134598.
#   Orbital only returns 134598 and is frozen below.
# Verification lives under parent_query.dr3.verification (SampleProvenance
# forbids extra keys; #104 schema).
#
# schema_version 2 (2026-09-25, provenance note, issue #257):
#   Ryan Foley's ruling on #254 (escalation from #233's reconciliation of
#   #230's confirmed Andrews et al. (2022) M1 methodology): "Yes, update the
#   selection to the Apsis / uniform M1 mass. Adjust the query, etc." This
#   replaces the earlier fixed M1 = 1.0 Msun convention (kept below only in
#   this comment for history) used by the m2_probability cut with Gaia Apsis
#   FLAME mass (astrophysical_parameters.mass_flame) plus a **fixed**
#   +/-0.1 Msun Gaussian error when FLAME mass is available for a source,
#   else a uniform draw between 0.63 and 1.0 Msun per Monte Carlo
#   realization. The fixed error is our own modeling choice, not Gaia's
#   reported uncertainty: gaiadr3.astrophysical_parameters has no symmetric
#   mass_flame_error column, only mass_flame_lower/mass_flame_upper
#   (16%/84% confidence interval) — confirmed against the live Gaia TAP_SCHEMA
#   at dispatch of #257. This is the one frozen-file edit this wave
#   explicitly authorizes; Ryan's sign-off on #254/#257 is the required
#   human escalation. Re-measurement of the m2_probability attrition against
#   the published 106 is tracked separately (#257 acceptance checklist item,
#   docs/SELECTION_REPRODUCTION_STATUS.md §3.1).
#
# schema_version 3 (2026-09-27, provenance note, issue #296; closes #255):
#   The PI (Ryan Foley, co-author of Andrews, Taggart & Foley 2022) supplied
#   the notebook that actually selected the published sample:
#   data/reference/andrews2022_ATF_sample_selection.ipynb (gitignored, not
#   committed; sha256 in reproduction_procedure.source_sha256). Supplying the
#   code is the sanction for this frozen-file change. Its code is now the spec
#   for REPRODUCTION mode, including its quirks (#296):
#     pass 1 (find_massive, cell 7): M1 = 1.0 fixed; 10^4 full-covariance
#       draws built from *_error + corr_vec WITHOUT bit_index; source rejected
#       when scipy.stats.multivariate_normal refuses the covariance (NaN,
#       non-PSD, singular -- no eigenvalue flooring) or when brentq on
#       [0, 1000] fails for ANY draw; pass iff fraction(M2 > 1.4) > 0.95
#       (strict) over ALL draws.
#     pass 2 (plot_system, cell 17 / calc_M2, cell 34), on the pass-1
#       survivors: GoF > 5 rejected; Gaia BH1 removed by hand (the exclusion
#       below); refined M1 = UCO Lick spectroscopic mass N(m, 0.1) for 8
#       hardcoded sources, else Apsis FLAME N(mass_flame, 0.1), else
#       U(0.63, 1.0); Apsis logg < 3.6 rejected only outside the Lick branch;
#       CMD line through (-0.5, -2) and (3, 9) (slope 11/3.5, intercept
#       9 - 3*slope, EXACT -- #255), NSS-parallax absolute mags, no
#       extinction; brentq on [0, 10000] per refined-M1 draw, any failure
#       rejected; mean(M2) < 3 std(M2) rejected.
#   The reproduction chain is the atf_* cuts (applies_to: [reproduction]).
#   The schema_version-2 chain below them is kept VERBATIM with
#   applies_to: [forward_model] so forward_model evaluation (andrews2022_modified
#   in the registry) is unchanged; primary_mass (flame_or_uniform_draw) stays
#   because it still drives the p_m2_above cache columns that chain reads.
#   The atf_* columns are precomputed by scripts/build_andrews2022_atf_columns.py.
#
# schema_version 4 (2026-09-28, provenance note, issue #306; Ryan Foley's
# decision on #296/#306, verbatim: "Use the Andrews notebook procedure for the
# forward model. For Andrews, follow the notebook exactly. If Gaia provides a
# separate logg_gspphot, then we should have two columns, one Gaia and one
# Vizier. The Andrews pass 1 isn't critical if we end up with the correct
# sample in the end." That decision is the sanction for this frozen-file edit.
# No threshold changes.
#   * forward_model now runs the SAME atf_* chain (applies_to: [reproduction,
#     forward_model]). The schema_version-2 chain (m2_probability >= 0.95 on
#     the FLAME/uniform p_m2_above MC columns, goodness_of_fit, m2_snr,
#     giant_reject_logg on logg_apsis, CMD 3.14/-0.43) is removed; see
#     schema_version 2/3 above for its history.
#   * The only forward-model difference is the pass-2 refined M1
#     (reproduction_procedure.pass2.forward_model_primary_mass): the
#     pipeline's own bulk-tier TAG10 M1 posterior N(M1, sigma_M1), else the
#     notebook's U(0.63, 1.0) no-mass fallback, instead of the paper's UCO
#     Lick -> FLAME -> uniform rule. Pass 1 stays at the notebook's fixed
#     M1 = 1.0. With no Lick branch, atf_giant_reject_logg applies to every
#     source in forward_model. Each mode has its own sidecar.
#   * Two logg columns: the notebook's giant cut and FLAME M1 read VizieR
#     I/355/paramp (massive_apsis.vot), now carried as logg_vizier_apsis /
#     mass_flame_vizier_apsis beside the Gaia-archive logg_gspphot /
#     mass_flame (scripts/fetch_vizier_apsis.py snapshot,
#     dr3.vizier_apsis_snapshot_meta). Measured on the 6107-source snapshot:
#     VizieR logg == archive logg_gspphot to 2.4e-7 (4-decimal rounding), and
#     VizieR Mass-Flame == archive mass_flame to 5e-4 (3-decimal rounding).
#   * The top-level primary_mass block (flame_or_uniform_draw) no longer feeds
#     any Andrews cut; it is kept only because it still defines the legacy
#     p_m2_above MC cache columns (scripts/attach_mc_to_selection_cache.py).

schema_version: 4
name: andrews2022
provenance:
  reference: "Andrews et al. (2022)"
  section: "Sample selection"
  published_n: 24
  data_release: dr3
  frozen_on: "2026-09-03"
  arxiv: "2207.00680"
mode: reproduction
primary_mass:
  method: flame_or_uniform_draw
  flame_column: mass_flame
  flame_fixed_error_msun: 0.1
  uniform_low_msun: 0.63
  uniform_high_msun: 1.0
  # #230/#257: Gaia Apsis FLAME mass with a fixed +/-0.1 Msun Gaussian error
  # when available, else Uniform(0.63, 1.0) Msun. Replaces the earlier fixed
  # M1 = 1.0 Msun first-cut assumption for the m2_probability cut.
  # schema_version 4 (#306): read by no Andrews cut in either mode; defines
  # only the legacy p_m2_above MC cache columns. The selection M1 is
  # reproduction_procedure below.
reproduction_procedure:
  method: atf_notebook
  source: "data/reference/andrews2022_ATF_sample_selection.ipynb (supplied by Ryan Foley, 2026-09-27; #296)"
  source_sha256: 343dc9e1c997d8cfa74af4ee448c92fcc058e601ff39b94fdf68a3b105c5ccad
  covariance:
    # Notebook get_random_samples `means` / `var_err` order (cell 7).
    parameter_order:
      - ra
      - dec
      - parallax
      - pmra
      - pmdec
      - a_thiele_innes
      - b_thiele_innes
      - f_thiele_innes
      - g_thiele_innes
      - eccentricity
      - period
      - t_periastron
    use_bit_index: false
    gate: scipy_multivariate_normal_strict
    # The notebook parsed the archive CSV (float32 printed as shortest decimal).
    float32_decimal_roundtrip: true
  pass1:
    # find_massive(idx, N_samples=10000); M1 = 1.0 * np.ones(N_samples).
    n_draws: 10000
    random_seed: 20220701
    m1_msun: 1.0
    root_bracket_msun: [0.0, 1000.0]
    reject_source_on_any_draw_failure: true
    probability_denominator: all_draws
    probability_cut_id: atf_m2_probability
  pass2:
    # plot_system(idx, apsis_id, N_samples=10000).
    n_draws: 10000
    random_seed: 20220702
    root_bracket_msun: [0.0, 10000.0]
    reject_source_on_any_draw_failure: true
    # np.std default (population std).
    m2_std_ddof: 0
    # schema_version 4 (#306): the notebook's VizieR I/355/paramp `logg`
    # (massive_apsis.vot), as its own column. It is the GSP-Phot logg
    # (== astrophysical_parameters.logg_gspphot to 4-decimal rounding), not
    # logg_msc1. Was logg_gspphot at schema_version 3.
    giant_logg_column: logg_vizier_apsis
    primary_mass:
      lick_sigma_msun: 0.1
      lick_provenance: >-
        UCO Lick spectroscopic primary masses hardcoded in the ATF notebook
        (plot_system cell 17 and calc_M2 cell 34; legend "UCO Lick Spectral
        Masses", cell 35). 4373465352415301632 (Gaia BH1) is listed but is
        unreachable in the published run (removed by hand first); it applies
        in andrews2022_modified.
      lick_spectroscopic_masses:
        - {source_id: 3649963989549165440, m1_msun: 0.47}
        - {source_id: 1581117310088807552, m1_msun: 0.70}
        - {source_id: 1947292821452944896, m1_msun: 0.73}
        - {source_id: 1350295047363872512, m1_msun: 1.44}
        - {source_id: 1525829295599805184, m1_msun: 0.64}
        - {source_id: 4373465352415301632, m1_msun: 0.98}
        - {source_id: 1854241667792418304, m1_msun: 0.70}
        - {source_id: 1749013354127453696, m1_msun: 1.00}
      # schema_version 4 (#306): the notebook's VizieR `Mass-Flame`
      # (== astrophysical_parameters.mass_flame to 3-decimal rounding). Was
      # mass_flame at schema_version 3.
      flame_column: mass_flame_vizier_apsis
      flame_sigma_msun: 0.1
      uniform_low_msun: 0.63
      uniform_high_msun: 1.0
    # schema_version 4 (#306): forward_model pass-2 M1 = the pipeline's own
    # bulk-tier M1 posterior (TAG10, run config mass_calibration), else the
    # notebook's own no-mass fallback U(0.63, 1.0). No Lick branch.
    forward_model_primary_mass:
      method: pipeline_tag10_bulk
      fallback: uniform
      uniform_low_msun: 0.63
      uniform_high_msun: 1.0
parent_query:
  dr3:
    adql: |
      SELECT nss.source_id, nss.nss_solution_type
      FROM gaiadr3.nss_two_body_orbit AS nss
      WHERE nss.nss_solution_type = 'Orbital'
    expected_parent_n: 134598
    nss_table: gaiadr3.nss_two_body_orbit
    solution_types:
      - Orbital
    verification:
      status: verified
      confirmed_count: 134598
      confirming_query: |
        SELECT COUNT(*) AS n
        FROM gaiadr3.nss_two_body_orbit AS nss
        WHERE nss.nss_solution_type = 'Orbital'
      verified_on: "2026-09-03"
  dr4:
    adql: |
      SELECT nss.source_id, nss.nss_solution_type
      FROM gaiadr4.nss_two_body_orbit AS nss
      WHERE nss.nss_solution_type = 'Orbital'
    expected_parent_n: null
    nss_table: gaiadr4.nss_two_body_orbit
    solution_types:
      - Orbital
    verification:
      status: unverified
      confirmed_count: null
      confirming_query: null
      verified_on: null
monte_carlo:
  n_draws: 10000
  covariance: full_12x12
cuts:
  # ---- ATF notebook chain (#296); both modes since schema_version 4 (#306) ----
  - id: atf_covariance_valid
    kind: derived
    applies_to: [reproduction, forward_model]
    # get_random_samples raised (NaN errors, non-PSD, singular) -> rejected.
    expression: "andrews_atf_covariance_ok == True"
    requires_defined: [andrews_atf_covariance_ok]
    expected_n_after: null
  - id: atf_pass1_root_found
    kind: derived
    applies_to: [reproduction, forward_model]
    # brentq(func, 0, 1000) raised for ANY draw at M1 = 1.0 -> rejected.
    expression: "andrews_atf_pass1_root_ok == True"
    requires_defined: [andrews_atf_pass1_root_ok]
    expected_n_after: null
  - id: atf_m2_probability
    kind: probability
    applies_to: [reproduction, forward_model]
    # len(M2[M2 > 1.4]) / len(m_f) > 0.95 -- strict, all draws.
    expression: "P(M2 > m2_threshold_msun) > m2_probability_min"
    expected_n_after: 106
    parameters:
      m2_threshold_msun: 1.4
      m2_probability_min: 0.95
      probability_column: andrews_atf_p_m2_above
  - id: atf_goodness_of_fit
    kind: derived
    applies_to: [reproduction, forward_model]
    # `if sys['goodness_of_fit'] > 5: return` (NaN passes).
    expression: "not defined(andrews_atf_goodness_of_fit) or not (andrews_atf_goodness_of_fit > goodness_of_fit_max)"
    expected_n_after: null
    parameters:
      goodness_of_fit_max: 5.0
  - id: atf_giant_reject_logg
    kind: derived
    applies_to: [reproduction, forward_model]
    # Apsis branch only: `if not np.isnan(logg) and logg < 3.6: return`.
    # forward_model has no Lick branch, so it applies to every source (#306).
    expression: "andrews_atf_m1_source == lick_m1_source or not defined(andrews_atf_logg) or not (andrews_atf_logg < logg_dwarf_min)"
    expected_n_after: null
    parameters:
      logg_dwarf_min: 3.6
      lick_m1_source: lick
  - id: atf_giant_reject_cmd
    kind: derived
    applies_to: [reproduction, forward_model]
    # slope = (9+2)/(3+0.5); intercept = 9 - 3*slope (the plotted line from
    # (-0.5, -2) to (3, 9)); reject if (BP-RP)*slope + intercept > G_abs.
    # NaN colour / magnitude (missing BP/RP, parallax <= 0) passes.
    expression: "not defined(andrews_atf_bp_rp) or not defined(andrews_atf_abs_g_mag) or not (andrews_atf_bp_rp * ((cmd_mag_2 - cmd_mag_1) / (cmd_color_2 - cmd_color_1)) + (cmd_mag_2 - cmd_color_2 * ((cmd_mag_2 - cmd_mag_1) / (cmd_color_2 - cmd_color_1))) > andrews_atf_abs_g_mag)"
    expected_n_after: null
    parameters:
      cmd_color_1: -0.5
      cmd_mag_1: -2.0
      cmd_color_2: 3.0
      cmd_mag_2: 9.0
      extinction_corrected: false
  - id: atf_pass2_root_found
    kind: derived
    applies_to: [reproduction, forward_model]
    # brentq(func, 0, 10000) with refined M1 raised for ANY draw -> rejected.
    expression: "andrews_atf_pass2_root_ok == True"
    requires_defined: [andrews_atf_pass2_root_ok]
    expected_n_after: null
  - id: atf_m2_3sigma
    kind: derived
    applies_to: [reproduction, forward_model]
    # `if np.mean(M2) < 3*np.std(M2): return`.
    expression: "not (andrews_atf_m2_mean_msun < m2_sigma_multiple * andrews_atf_m2_std_msun)"
    requires_defined: [andrews_atf_m2_mean_msun, andrews_atf_m2_std_msun]
    expected_n_after: null
    parameters:
      m2_sigma_multiple: 3.0
exclusions:
  - source_id: 4373465352415301632
    reason: "m_f ~ 11.6 Msun at P_orb = 186 d ~ 3x Gaia scanning period; probable scanning-law harmonic contaminant (Halbwachs et al. 2022)."
    expected_n_after: 24
