# rv_astrometry_gate + joint_orbit_fit choosables (ARCHITECTURE.md §4).
# chi2/dof threshold and SB2 consistency tolerances are config-owned — never hardcoded.

rv_consistency:
  chi2_dof_threshold: 5.0
  min_epochs_per_instrument: 3
  min_epochs_total: 3
  jitter_max_kms: 10.0
  sb2_period_frac_tol: 0.1
  sb2_ecc_abs_tol: 0.15
  joker_seed_variant: full
  # #347: reject placeholder RV epochs (mjd 0.0) before any fit.
  rv_epoch_min_mjd: 40000.0
  jitter_min_kms: 1.0e-3
  # #347 joint astrometry+RV fit: NSS solution vector + full covariance + RVs;
  # K derived from a0/parallax. Optima on a box edge are flagged bound hits.
  joint_m1_bounds_msun: [0.05, 100.0]
  joint_m2_bounds_msun: [1.0e-3, 1.0e3]
  joint_ecc_max: 0.99
  joint_fit_max_nfev: 20000
  joint_fit_decrement_tol: 1.0e-4
  joint_fisher_min_eig_ratio: 1.0e-12
  joint_lbfgsb_restarts: 5
  joint_polish_steps: 20
  joint_derivative_step: 1.0e-3
  joint_bound_tol: 1.0e-3
  # Prefer newer on-disk summaries (mtime) over stale pre-pipeline outputs.
  prefer_recent_summary_mtime: true
  # Gaia BH1 / BH2 calibrators (known_truth_gaia_bh.yaml).
  priority_source_ids:
    - 4373465352415301632
    - 5870569352746779008
  prefer_public_external_rvs: true
