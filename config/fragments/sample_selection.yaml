# Draft registry for sample_selection (CONTINUATION_PLAN §12.1).
# Review/Integration merges this into config/config.yaml at the checkpoint.
# Thresholds do NOT live here — they live in frozen per-sample files under
# config/selections/ (transcribed by #107 / #108 / #110). Two Andrews variants
# are two registry rows, not a flag. Andrews (#107) and El-Badry 2024 (#108)
# files exist and are enabled; El-Badry 2026 file exists but stays disabled
# until its registry enable lands; accel_jerk stays blocked (§9).
# Inference (#112) uses andrews2022_modified + elbadry2024 + elbadry2026
# (astrometric only) via inference.multi_sample — not this registry's
# reproduction/forward_model mode switch alone.

sample_selection:
  enabled: true
  samples:
    - name: andrews2022
      enabled: true
      path: config/selections/andrews2022.yaml
      mode: reproduction
    - name: andrews2022_modified
      enabled: true
      path: config/selections/andrews2022_modified.yaml
      mode: forward_model
    - name: elbadry2024
      enabled: true
      path: config/selections/elbadry2024.yaml
      mode: reproduction
    - name: elbadry2026
      enabled: false
      path: config/selections/elbadry2026.yaml
      mode: reproduction
    - name: accel_jerk
      enabled: false
      path: config/selections/accel_jerk.yaml
      mode: forward_model
