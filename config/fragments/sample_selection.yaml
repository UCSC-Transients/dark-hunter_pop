# Registry for sample_selection (CONTINUATION_PLAN §12.1).
# Merged into config/config.yaml at the Phase 8 closeout checkpoint.
# Thresholds do NOT live here — they live in frozen per-sample files under
# config/selections/. Two Andrews variants are two registry rows, not a flag.
# Inference uses andrews2022_modified + elbadry2024 + elbadry2026 (astrometric
# only) via inference.multi_sample. accel_jerk stays blocked (§9).

sample_selection:
  enabled: true
  samples:
    - name: andrews2022
      enabled: true
      path: config/selections/andrews2022.yaml
      mode: reproduction
    - name: andrews2022_modified
      enabled: true
      path: config/selections/andrews2022_modified.yaml
      mode: forward_model
    - name: elbadry2024
      enabled: true
      path: config/selections/elbadry2024.yaml
      mode: reproduction
    - name: elbadry2026
      enabled: true
      path: config/selections/elbadry2026.yaml
      mode: reproduction
    - name: accel_jerk
      enabled: false
      path: config/selections/accel_jerk.yaml
      mode: forward_model
