# mass_derivation_bulk / mass_derivation_refined choosables.
# TAG10 coefficient tables and Santos coeffs live in constants.py; scatters in mass_calibration.

mass_derivation:
  dark_companion_flux_ratio: 0.0
  uberms_m1_prior_max_msun: 3.0
  uberms_m1_watchlist_fraction: 0.95
  information_gain_sigma_floor_msun: 0.01
  sed_queue_max_stars: null
  # Snapshot/copy of dark-hunter_sed output/sed_summaries (see summary_paths.md).
  sed_summary_root: data/sed_summaries
  sed_summary_filename_template: "Gaia_DR3_{source_id}_sed_summary.json"
  # Snapshot/copy of dark-hunter_sed output/phot_sed (Path-2 model comparison);
  # read by phot_sed_adapter into the companion_nature photometry channel.
  phot_sed_root: data/phot_sed
  phot_sed_filename_template: "Gaia_DR3_{source_id}_{model}_summary.json"
  require_sed_package: false
  bulk_progress_log_interval: 10000
  bulk_m2_histogram_xmin_msun: 0.0
  bulk_m2_histogram_xmax_msun: 30.0
  bulk_m2_histogram_log_y: true
