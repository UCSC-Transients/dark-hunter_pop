# Independent DR3 / DR4 path config. Values may match but keys must never be shared.

dr3:
  mission_baseline_months: 34.0
  scanning_law_id: gaiadr3_pinned
  zero_point_version: dr3_pinned
  sed_filters: [G, BP, RP, J, H, Ks, W1, W2]
  # dark-hunter_rv Gaia_DR3_*_summary.json tree (see summary_paths.md).
  # Independent DR key even when value matches dr4.
  rv_summary_root: data/dr3/rv_summaries
  rv_summary_filename_template: "Gaia_DR3_{source_id}_summary.json"
  # #306: VizieR I/355/paramp snapshot (scripts/fetch_vizier_apsis.py).
  vizier_apsis_snapshot_meta: data/dr3/vizier_apsis/20260928T184758Z_cb5ebfebe7bc/meta.yaml
  quality_cut_bins:
    - g_max: 13.0
      gof_max: 10.0
    - g_min: 13.0
      gof_max: 5.0
  allow_astrometric_epoch_outliers: false

dr4:
  mission_baseline_months: 66.0
  scanning_law_id: gaiadr4_pinned
  zero_point_version: dr4_pinned
  sed_filters: [G, BP, RP, J, H, Ks, W1, W2]
  rv_summary_root: data/dr4/rv_summaries
  rv_summary_filename_template: "Gaia_DR3_{source_id}_summary.json"
  vizier_apsis_snapshot_meta: null
  quality_cut_bins:
    - g_max: 13.0
      gof_max: 10.0
    - g_min: 13.0
      gof_max: 5.0
  allow_astrometric_epoch_outliers: true
