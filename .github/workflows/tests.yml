name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Required merge check: fast suites only (ARCHITECTURE.md §10).
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run required suites
        # Prefer marked suites; also collect unmarked scaffold tests during Foundation rollout.
        run: pytest -q -m "unit or physics or api or (not unit and not physics and not api and not gaiamock and not network and not slow)"

  # Optional: manual / nightly until path-filter wiring in F6.
  gaiamock:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps + GSL
        run: |
          sudo apt-get update
          sudo apt-get install -y libgsl-dev gcc
          python -m pip install --upgrade pip
          pip install -e ".[dev,gaiamock]"
      - name: Install gaiamock-mod overlay from Release
        env:
          DOWNLOAD_FROM_RELEASE: "1"
        run: scripts/install_gaiamock_mod.sh
      - name: Run gaiamock suite
        run: pytest -q -m gaiamock
