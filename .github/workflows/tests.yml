name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      gaiamock: ${{ steps.filter.outputs.gaiamock }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gaiamock:
              - 'vendor/gaiamock/**'
              - 'vendor/overlays/**'
              - 'vendor/DATA_MANIFEST.md'
              - 'scripts/install_gaiamock_mod.sh'
              - 'src/darkhunter_pop/gaiamock_vendor.py'
              - 'tests/test_gaiamock_vendor.py'
              - '.github/workflows/tests.yml'

  # Required merge check: unit + physics + api only (ARCHITECTURE.md §10). Target ≪ 20 min.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run required suites
        run: pytest -q -m "unit or physics or api"

  # Optional: path-filter OR manual workflow_dispatch (needs Release assets + GSL).
  gaiamock:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.gaiamock == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps + GSL
        run: |
          sudo apt-get update
          sudo apt-get install -y libgsl-dev gcc
          python -m pip install --upgrade pip
          pip install -e ".[dev,gaiamock,plot]"
      - name: Install gaiamock-mod overlay from Release
        env:
          DOWNLOAD_FROM_RELEASE: "1"
        run: scripts/install_gaiamock_mod.sh
      - name: Run gaiamock suite
        run: pytest -q -m gaiamock
