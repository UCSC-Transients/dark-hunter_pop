name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Required merge check: fast suites only (ARCHITECTURE.md §10).
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run required suites
        # Scaffold has no markers yet; Foundation will add unit/physics/api marks.
        # Until then, run the full default pytest collection (scaffold smoke tests).
        run: pytest -q

  # Optional: enabled when vendor/gaiamock or install script changes (and Release assets exist).
  gaiamock:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Placeholder
        run: echo "gaiamock suite wired in Foundation F0/F6 once Release gaiamock-mod-v1 exists"
