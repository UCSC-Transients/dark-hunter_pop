[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dark-hunter-pop"
version = "0.1.0"
description = "Compact-object mass function for the Dark Hunters (Gaia astrometric binaries, forward-modeled with gaiamock)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
dependencies = [
  "numpy>=1.26,<2.0",
  "scipy>=1.11",
  "astropy>=6.0",
  "astroquery>=0.4",
  "h5py>=3.10",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "h5py>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
plot = ["matplotlib>=3.8"]
inference = ["dynesty>=2.1"]
gaiamock = ["healpy>=1.16", "joblib>=1.3", "mwdust>=1.0", "threadpoolctl>=3.7"]
# Volume-limited Malmquist diagnostic only (#391 MP-Q32; installed with numpy<2 kept).
volume_diagnostic = ["gaiaunlimited>=0.3.3"]
sheets = ["google-api-python-client>=2.100", "google-auth>=2.22"]
# #418: Bayestar19 posterior samples (MP-Q34 evaluation) and the GSP-Phot [M/H] calibration
# (MP-Q33, Andrae et al. 2023). Installed with numpy 1.26.4 kept.
isochrone = ["dustmaps>=1.0.14", "gdr3apcal>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["darkhunter_pop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "unit: fast unit tests (required CI)",
  "physics: analytic physics tests (required CI)",
  "api: cross-module I/O contract tests (required CI)",
  "gaiamock: requires vendored gaiamock_mod overlay + compiled .so",
  "network: requires external network services",
  "slow: long-running / performance tests",
]
